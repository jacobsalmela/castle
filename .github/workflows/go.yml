# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: build and upload

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: create draft release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ steps.prev_tag.outputs.previous_tag }}" ]; then
            gh release create ${{ github.ref_name }} \
              --draft \
              --generate-notes \
              --notes-start-tag ${{ steps.prev_tag.outputs.previous_tag }} \
              --title "${{ github.ref_name }}"
          else
            gh release create ${{ github.ref_name }} \
              --draft \
              --generate-notes \
              --title "${{ github.ref_name }}"
          fi

  build:
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bin-linux
            artifact: chronotome-linux-amd64
          # - os: ubuntu-latest
          #   target: bin-linux-arm64
          #   artifact: chronotome-linux-arm64
          - os: macos-latest
            target: bin-darwin
            artifact: chronotome-darwin-amd64
          - os: macos-latest
            target: bin-darwin-arm64
            artifact: chronotome-darwin-arm64
          - os: windows-latest
            target: bin-windows
            artifact: chronotome-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: set up go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: install system dependencies
        run: make deps-system

      - name: build for ${{ matrix.os }}
        run: make ${{ matrix.target }}

      - name: test
        run: make test

      - name: upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}

      - name: upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} bin/${{ matrix.artifact }} --clobber
